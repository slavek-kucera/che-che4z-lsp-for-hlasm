name: CI

on:
  push:
    branches:
      - master
      - development
      - release-next
      - ci_diag
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:

defaults:
  run:
    shell: sh

jobs:
  test-matrix:
    name: Test
    runs-on: macos-26
    defaults:
      run:
        working-directory: clients/vscode-hlasmplugin
    steps:
      - uses: actions/checkout@v6
      - name: NPM CI
        run: npm ci --verbose
